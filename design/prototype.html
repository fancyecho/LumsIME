<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luma 动效原型</title>
<style>
@property --a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
:root {
  --ink: #1d1d1f; --ink2: #6e6e73; --ink3: #a1a1a6;
  --glass: rgba(255,255,255,.58); --glass-rim: rgba(255,255,255,.75); --glass-line: rgba(0,0,0,.07);
  --lens: rgba(255,255,255,.92); --doc: rgba(255,255,255,.62);
  --accent: #0a6cff; --accent2: #4f9bff;
  --chip: rgba(255,255,255,.6); --chip-on: #1d1d1f; --chip-on-ink: #fff;
  --page: #e9e6f2;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ink: #f5f5f7; --ink2: #a1a1a6; --ink3: #6e6e73;
  --glass: rgba(38,38,44,.55); --glass-rim: rgba(255,255,255,.14); --glass-line: rgba(255,255,255,.06);
  --lens: rgba(255,255,255,.2); --doc: rgba(28,28,32,.6);
  --chip: rgba(255,255,255,.1); --chip-on: #f5f5f7; --chip-on-ink: #1d1d1f;
  --page: #121216;
} }
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 28px; }
#stage { position: relative; height: 440px; border-radius: 22px; overflow: hidden; outline: none; cursor: text;
  background:
    radial-gradient(60% 70% at 15% 20%, #ffb18a 0%, transparent 60%),
    radial-gradient(55% 60% at 85% 25%, #8f8cff 0%, transparent 60%),
    radial-gradient(60% 70% at 70% 95%, #5fd3c7 0%, transparent 60%),
    radial-gradient(50% 60% at 20% 95%, #ff7bb0 0%, transparent 60%), #c9c3e6; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #stage { filter: saturate(.9) brightness(.62); } }
.doc { position: absolute; left: 6%; right: 6%; top: 48px; height: 230px; border-radius: 16px; background: var(--doc);
  backdrop-filter: blur(30px) saturate(160%); -webkit-backdrop-filter: blur(30px) saturate(160%);
  box-shadow: 0 0 0 .5px var(--glass-line), 0 20px 50px -20px rgba(40,30,80,.35); padding: 34px 36px; }
.doc .bar3 { position: absolute; top: 12px; left: 14px; display: flex; gap: 7px; }
.doc .bar3 i { width: 11px; height: 11px; border-radius: 50%; background: var(--ink3); opacity: .45; }
#line { font-size: 24px; line-height: 36px; letter-spacing: .2px; word-break: break-all; }
#pre { color: var(--accent); text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 5px; }
#caret { display: inline-block; width: 2px; height: 28px; margin-left: 1px; vertical-align: -6px; background: var(--accent); border-radius: 1px; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.landing { opacity: 0; }
.glass { background: var(--glass); backdrop-filter: blur(24px) saturate(190%); -webkit-backdrop-filter: blur(24px) saturate(190%);
  box-shadow: inset 0 0 0 .5px var(--glass-rim), 0 0 0 .5px var(--glass-line), 0 14px 34px -10px rgba(20,10,60,.38), 0 2px 6px rgba(20,10,60,.08); }
#bar { position: absolute; left: 0; top: 0; overflow: hidden; display: none; will-change: width, height, transform; }
#cells { position: absolute; left: 6px; top: 0; bottom: 0; display: flex; align-items: center; white-space: nowrap; }
#pager { position: absolute; right: 7px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 1px; font-size: 9px; color: var(--ink2); line-height: 9px; }
.cell { position: relative; display: flex; align-items: baseline; gap: 4px; padding: 6px 10px; cursor: pointer; z-index: 1; }
.cell .lb { font-size: 11px; font-weight: 600; color: var(--ink3); font-variant-numeric: tabular-nums; transition: color .15s; }
.cell .tx { font-size: 17px; color: var(--ink); transition: color .15s, transform .25s cubic-bezier(.3,1.4,.5,1); display: inline-block; }
.cell .cm { font-size: 11px; color: var(--ink2); }
body.focus .cell:first-child .tx { font-size: 21px; font-weight: 500; }
body.focus .cell:not(:first-child) .tx { color: var(--ink2); }
body.blue .cell.sel .tx, body.blue .cell.sel .lb { color: #fff !important; }
body.lens .cell.sel .tx { color: var(--ink) !important; transform: scale(1.06); }
body.lens .cell.sel .lb { color: var(--accent); }
#hl { position: absolute; top: 5px; left: 0; border-radius: 10px; z-index: 0; will-change: transform, width; }
body.blue #hl { background: linear-gradient(180deg, var(--accent2), var(--accent)); box-shadow: 0 3px 10px -2px rgba(10,108,255,.55), inset 0 1px 0 rgba(255,255,255,.35); }
body.lens #hl { background: var(--lens); box-shadow: 0 0 0 .5px rgba(0,0,0,.06), 0 4px 14px -4px rgba(20,10,60,.3), inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(0,0,0,.04); }
.blurin { animation: blurin .16s ease-out; }
@keyframes blurin { from { filter: blur(2px); opacity: .45; transform: translateY(2px); } }
.slide-r { animation: slider .32s cubic-bezier(.2,.9,.3,1) both; }
.slide-l { animation: slidel .32s cubic-bezier(.2,.9,.3,1) both; }
@keyframes slider { from { opacity: 0; transform: translateX(18px); filter: blur(3px); } }
@keyframes slidel { from { opacity: 0; transform: translateX(-18px); filter: blur(3px); } }
#glow { position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; opacity: 0; pointer-events: none; z-index: 2;
  background: conic-gradient(from var(--a), #ff6ec4, #ffb36e, #ffe66e, #6effc8, #6ec8ff, #9a6eff, #ff6ec4);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
#glow.on { animation: glow 1.3s ease-out; }
@keyframes glow { 0% { opacity: 0; --a: 0deg; } 20% { opacity: 1; } 100% { opacity: 0; --a: 300deg; } }
.fly { position: absolute; left: 0; top: 0; white-space: nowrap; pointer-events: none; transform-origin: 0 0; z-index: 5; color: var(--ink); will-change: transform; }
#tag { position: absolute; display: none; z-index: 6; pointer-events: none; font-weight: 600; }
#tag.pill { height: 22px; min-width: 22px; padding: 0 7px; border-radius: 11px; font-size: 12px; line-height: 22px; text-align: center; }
#tag.pill.in { animation: tagin .5s cubic-bezier(.25,1.5,.45,1) both; }
#tag.pill.flip { animation: tagflip .45s cubic-bezier(.3,1.3,.5,1) both; }
#tag.pill.out { animation: tagout .25s ease-in both; }
@keyframes tagin { from { opacity: 0; transform: translateY(10px) scale(.2); filter: blur(4px); } }
@keyframes tagflip { 0% { transform: rotateX(90deg) scale(.9); } 100% { transform: rotateX(0) scale(1); } }
@keyframes tagout { to { opacity: 0; transform: translateY(6px) scale(.6); filter: blur(3px); } }
#tag.box { width: 44px; height: 44px; border-radius: 14px; font-size: 20px; line-height: 44px; text-align: center; animation: boxin .25s ease-out both; }
#tag.box.out { animation: boxout .15s ease-in both; }
@keyframes boxin { from { opacity: 0; transform: scale(.9); } }
@keyframes boxout { to { opacity: 0; transform: scale(.9); } }
#barfade { transition: none; }
.controls { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { border: 0; border-radius: 999px; padding: 7px 13px; font: inherit; font-size: 13px; background: var(--chip); color: var(--ink); cursor: pointer;
  box-shadow: inset 0 0 0 .5px var(--glass-line); transition: background .15s, color .15s, transform .1s; }
.chip:active { transform: scale(.96); }
.chip.on { background: var(--chip-on); color: var(--chip-on-ink); }
.chip.main { font-weight: 600; }
.sep { width: 1px; height: 22px; background: var(--ink3); opacity: .4; margin: 0 4px; }
.hint { margin-top: 12px; font-size: 12.5px; color: var(--ink2); }
.hint kbd { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; padding: 1px 5px; border-radius: 4px; background: var(--chip); box-shadow: inset 0 0 0 .5px var(--glass-line); }
@media (max-width: 640px) { #stage { height: 400px; } .doc { left: 16px; right: 16px; padding: 30px 20px; } #line { font-size: 20px; } }
</style>
</head>
<body class="blue">
<div class="wrap">
  <div id="stage" tabindex="0">
    <div class="doc"><div class="bar3"><i></i><i></i><i></i></div>
      <div id="line"><span id="committed"></span><span id="pre"></span><span id="caret"></span></div>
    </div>
    <div id="bar" class="glass"><div id="glow"></div><div id="hl"></div><div id="cells"></div><div id="pager"><span>▲</span><span>▼</span></div></div>
    <div id="tag" class="glass"></div>
  </div>

  <div class="controls">
    <button class="chip main" id="play">▶ 自动演示</button>
    <button class="chip" id="compare">对比：当前版本</button>
    <span class="sep"></span>
    <button class="chip on" data-fx="drop">液滴生长</button>
    <button class="chip on" data-fx="jelly">果冻高光</button>
    <button class="chip on" data-fx="lens">玻璃透镜</button>
    <button class="chip on" data-fx="fly">上屏飞入</button>
    <button class="chip on" data-fx="focus">首选突出</button>
    <button class="chip on" data-fx="ripple">逐字浮现</button>
    <button class="chip on" data-fx="glow">整句灵光</button>
    <button class="chip on" data-fx="pill">中英胶囊</button>
  </div>
  <div class="hint">点击上方画面后直接打字：拼音 · <kbd>空格</kbd> 上屏 · <kbd>1</kbd>–<kbd>7</kbd> 选词 · <kbd>←</kbd><kbd>→</kbd> 移动 · <kbd>-</kbd><kbd>=</kbd> 翻页 · 单按 <kbd>Shift</kbd> 切换中英 · <kbd>Esc</kbd> 清除</div>
</div>

<script>
const WORDS = `ni hao:你好|ni:你,尼,泥,逆,拟,妮|hao:好,号,浩,豪,毫|shi jie:世界,时节,师姐,视界,十届,石阶,使节|shi:是,时,事,十,世,市,师|jie:界,节,接,街,姐,解,结
jin tian:今天,金田|jin tian tian qi:今天天气|jin tian tian qi zhen hao:今天天气真好|tian qi:天气|zhen hao:真好|jin:今,金,进,近,紧,尽,仅|tian:天,田,甜,填|qi:气,起,其,期,七,器|zhen:真,针,阵,镇|wo:我,握,窝,沃
wo xiang:我想|wo xiang zuo:我想做|wo xiang zuo yi ge:我想做一个|wo xiang zuo yi ge shu ru fa:我想做一个输入法|shu ru fa:输入法|shu ru:输入|yi ge:一个|zuo:做,坐,左,作,座|xiang:想,向,像,香,项|yi:一,以,已,意,易|ge:个,各,歌,哥,格
shu:书,输,树,数,舒|ru:如,入,乳|fa:发,法,罚|mei:美,没,每,妹|mei hao:美好|she ji:设计,射击,涉及|she:设,社,射,舍|dong xiao:动效|dong:动,东,懂,冬|xiao:效,小,笑,校|hao kan:好看|kan:看,砍,刊|gao ji:高级|gao:高,搞,告|ji:级,及,机,几,记,计
ye tai:液态|ye:液,也,页,夜|tai:态,太,台|bo li:玻璃|bo:玻,波,播|li:璃,里,力,理|ling guang:灵光|ling:灵,零,领|guang:光,广|zhong wen:中文|zhong:中,种,重|wen:文,问,温|ke yi:可以|ke:可,课,科|xie xie:谢谢|xie:谢,写,些,鞋
zai jian:再见|zai:在,再|jian:见,件,间,剑|peng you:朋友|you:有,又,友,由|ming tian:明天|ming:明,名,命|jing yan:惊艳|jing:惊,经,精|yan:艳,眼,言,研|luo:落,罗,洛|ya:呀,压,牙|a:啊,阿`;
const ENTRIES = [], SYL = new Set();
WORDS.split(/[|\n]/).forEach(p => { const [py, ws] = p.split(':'); const syl = py.split(' '); syl.forEach(s => SYL.add(s));
  ws.split(',').forEach(w => ENTRIES.push({ key: syl.join(''), syl, w })); });

function segment(s) {
  const out = []; let i = 0;
  while (i < s.length) { let hit = '';
    for (let j = Math.min(s.length, i + 6); j > i; j--) if (SYL.has(s.slice(i, j))) { hit = s.slice(i, j); break; }
    if (!hit) { out.push(s.slice(i)); break; } out.push(hit); i += hit.length; }
  return out;
}
function candidatesFor(s) {
  const list = [], seen = new Set(); const add = (w, used) => { if (!seen.has(w)) { seen.add(w); list.push({ w, used }); } };
  ENTRIES.filter(e => e.key === s).forEach(e => add(e.w, s.length));
  ENTRIES.filter(e => e.key !== s && e.key.startsWith(s)).sort((a, b) => a.key.length - b.key.length).forEach(e => add(e.w, s.length));
  const prefixes = ENTRIES.filter(e => e.key !== s && s.startsWith(e.key)).sort((a, b) => b.key.length - a.key.length);
  prefixes.forEach(e => add(e.w, e.key.length));
  if (!list.length) add(s, s.length);
  return list;
}

const $ = id => document.getElementById(id);
const stage = $('stage'), bar = $('bar'), cellsEl = $('cells'), hl = $('hl'), pager = $('pager'), glowEl = $('glow'), tag = $('tag');
const fx = { drop: 1, jelly: 1, lens: 1, fly: 1, focus: 1, ripple: 1, glow: 1, pill: 1 };
const S = { input: '', cands: [], page: 0, hi: 0, ascii: false, visible: false, closing: false };
const PAGE = 7;

class Spring { constructor(v, k = 420, c = 32) { this.v = v; this.t = v; this.vel = 0; this.k = k; this.c = c; }
  step(dt) { const f = -this.k * (this.v - this.t) - this.c * this.vel; this.vel += f * dt; this.v += this.vel * dt; }
  snap(x) { this.v = this.t = x; this.vel = 0; } settled() { return Math.abs(this.v - this.t) < .1 && Math.abs(this.vel) < .1; } }
const W = new Spring(0, 520, 34), H = new Spring(0, 520, 34), Y = new Spring(0, 380, 26), A = new Spring(0, 300, 30);
const L = new Spring(0), R = new Spring(0);
let anchor = { x: 0, y: 0, mid: 0 }, flies = [];

function applyBodyClasses() {
  document.body.classList.toggle('lens', !!fx.lens); document.body.classList.toggle('blue', !fx.lens);
  document.body.classList.toggle('focus', !!fx.focus);
}

function caretBox() {
  const c = $('caret').getBoundingClientRect(), s = stage.getBoundingClientRect();
  return { x: c.left - s.left, top: c.top - s.top, bottom: c.bottom - s.top };
}

function pageItems() { return S.cands.slice(S.page * PAGE, S.page * PAGE + PAGE); }

function render(kind) {
  const items = pageItems(), old = [...cellsEl.children].map(c => c.querySelector('.tx').textContent);
  cellsEl.innerHTML = '';
  items.forEach((c, i) => {
    const d = document.createElement('div'); d.className = 'cell' + (i === S.hi ? ' sel' : '');
    d.innerHTML = `<span class="lb">${i + 1}</span><span class="tx">${c.w}</span>`;
    d.onmousedown = e => { e.preventDefault(); select(i); };
    if (kind === 'page') { d.classList.add(S.pageDir > 0 ? 'slide-r' : 'slide-l'); d.style.animationDelay = (i * 22) + 'ms'; }
    else if (kind === 'type' && fx.ripple && old[i] !== c.w) { d.querySelector('.tx').classList.add('blurin'); }
    cellsEl.appendChild(d);
  });
  const more = S.page > 0 || (S.page + 1) * PAGE < S.cands.length;
  pager.style.display = more ? 'flex' : 'none';
  pager.children[0].style.opacity = S.page > 0 ? .9 : .25; pager.children[1].style.opacity = (S.page + 1) * PAGE < S.cands.length ? .9 : .25;
  const targetW = cellsEl.scrollWidth + 12 + (more ? 14 : 0), targetH = fx.focus ? 50 : 44;
  if (fx.drop) { W.t = targetW; H.t = targetH; } else { W.snap(targetW); H.snap(targetH); }
  placeHighlight(kind);
  if (kind === 'type' && fx.glow && items[0] && [...items[0].w].length >= 4 && S.cands[0].used === S.input.length) {
    glowEl.classList.remove('on'); void glowEl.offsetWidth; glowEl.classList.add('on');
  }
}

function placeHighlight(kind) {
  const cell = cellsEl.children[S.hi]; if (!cell) return;
  const l = cell.offsetLeft + 6, r = l + cell.offsetWidth;
  if (kind === 'move' && fx.jelly) {
    const right = l > L.t;
    L.k = right ? 230 : 760; L.c = right ? 22 : 38; R.k = right ? 760 : 230; R.c = right ? 38 : 22;
    L.t = l; R.t = r;
  } else if (kind === 'move' || kind === 'page') {
    L.k = R.k = 420; L.c = R.c = 34; L.t = l; R.t = r;
  } else { L.snap(l); R.snap(r); }
  [...cellsEl.children].forEach((c, i) => c.classList.toggle('sel', i === S.hi));
}

function show() {
  const c = caretBox(); anchor = { x: c.x - 12, below: c.bottom + 10, mid: (c.top + c.bottom) / 2 - 6 };
  if (!S.visible || S.closing) {
    S.visible = true; S.closing = false; bar.style.display = 'block'; bar.style.left = anchor.x + 'px'; bar.style.top = anchor.below + 'px';
    if (fx.drop) { W.snap(12); H.snap(12); Y.snap(anchor.mid); Y.t = anchor.below; A.snap(0); A.t = 1; bar.style.transform = ''; bar.style.opacity = 1; }
    else { Y.snap(anchor.below); A.snap(1); bar.animate([{ opacity: 0, transform: 'scale(.92)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 220, easing: 'cubic-bezier(.2,.9,.3,1.2)' }); }
  } else { Y.t = anchor.below; if (!fx.drop) Y.snap(anchor.below); }
}
function hide() {
  if (!S.visible) return;
  if (fx.drop) { S.closing = true; W.t = 12; H.t = 12; A.t = 0; Y.t = anchor.mid; }
  else { const a = bar.animate([{ opacity: 1 }, { opacity: 0, transform: 'scale(.95)' }], { duration: 130, easing: 'ease-out' }); a.onfinish = () => { if (!S.input) { bar.style.display = 'none'; S.visible = false; } }; }
}

function update(kind) {
  $('pre').textContent = S.input ? segment(S.input).join(' ') : '';
  if (!S.input) { hide(); return; }
  if (kind !== 'move' && kind !== 'page') { S.cands = candidatesFor(S.input); S.page = 0; S.hi = 0; }
  show(); render(kind);
}

function commitText(text, fromCell) {
  const land = document.createElement('span'); land.textContent = text;
  if (fx.fly && fromCell) {
    land.className = 'landing'; $('committed').appendChild(land);
    const src = fromCell.querySelector('.tx').getBoundingClientRect(), s = stage.getBoundingClientRect();
    const srcSize = parseFloat(getComputedStyle(fromCell.querySelector('.tx')).fontSize);
    const el = document.createElement('div'); el.className = 'fly'; el.textContent = text; el.style.fontSize = srcSize + 'px'; stage.appendChild(el);
    const dst = land.getBoundingClientRect(), dstSize = parseFloat(getComputedStyle($('line')).fontSize);
    const f = { el, land, x: new Spring(src.left - s.left, 300, 24), y: new Spring(src.top - s.top, 300, 24), k: new Spring(1, 300, 22), born: performance.now() };
    f.x.t = dst.left - s.left; f.y.t = dst.top - s.top + (dst.height - dstSize * 1.25) / 2; f.k.t = dstSize / srcSize;
    f.y.vel = -260; flies.push(f);
  } else { $('committed').appendChild(land); }
}

function select(i) {
  const c = pageItems()[i]; if (!c) return;
  const cell = cellsEl.children[i];
  commitText(c.w, cell);
  S.input = S.input.slice(c.used);
  update('type');
}

function toggleAscii() {
  S.ascii = !S.ascii;
  if (S.input) { commitText(S.input, null); S.input = ''; update('type'); }
  const c = caretBox(); clearTimeout(tag._t);
  if (fx.pill) {
    tag.className = 'glass pill'; tag.textContent = S.ascii ? 'A' : '中'; tag.style.display = 'block';
    tag.style.left = (c.x + 4) + 'px'; tag.style.top = (c.top - 26) + 'px';
    void tag.offsetWidth; tag.classList.add(tag._shown ? 'flip' : 'in'); tag._shown = true;
    tag._t = setTimeout(() => { tag.classList.remove('in', 'flip'); tag.classList.add('out'); tag._shown = false; setTimeout(() => { if (!tag._shown) tag.style.display = 'none'; }, 260); }, 1100);
  } else {
    tag.className = 'glass box'; tag.textContent = S.ascii ? 'A' : '中'; tag.style.display = 'block';
    tag.style.left = (c.x - 10) + 'px'; tag.style.top = (c.bottom + 10) + 'px'; tag._shown = true;
    tag._t = setTimeout(() => { tag.classList.add('out'); tag._shown = false; setTimeout(() => { if (!tag._shown) tag.style.display = 'none'; }, 160); }, 900);
  }
}

function key(k) {
  if (k === 'Shift') return toggleAscii();
  if (S.ascii) { if (k.length === 1) commitText(k, null); else if (k === 'Backspace') $('committed').lastChild?.remove(); return; }
  if (/^[a-z]$/.test(k)) { S.input += k; return update('type'); }
  if (!S.input) { if (k === 'Backspace') { const n = $('committed').lastChild; if (n) { n.textContent = [...n.textContent].slice(0, -1).join(''); if (!n.textContent) n.remove(); } } else if (k.length === 1) commitText(k === ',' ? '，' : k === '.' ? '。' : k, null); return; }
  const items = pageItems();
  if (k === 'Backspace') { S.input = S.input.slice(0, -1); return update('type'); }
  if (k === 'Escape') { S.input = ''; return update('type'); }
  if (k === 'Enter') { commitText(S.input, null); S.input = ''; return update('type'); }
  if (k === ' ') return select(S.hi);
  if (/^[1-7]$/.test(k)) return select(+k - 1);
  if (k === 'ArrowRight') { if (S.hi < items.length - 1) { S.hi++; placeHighlight('move'); } else if ((S.page + 1) * PAGE < S.cands.length) { key('='); } return; }
  if (k === 'ArrowLeft') { if (S.hi > 0) { S.hi--; placeHighlight('move'); } return; }
  if (k === '=' || k === 'ArrowDown') { if ((S.page + 1) * PAGE < S.cands.length) { S.page++; S.pageDir = 1; S.hi = 0; render('page'); } return; }
  if (k === '-' || k === 'ArrowUp') { if (S.page > 0) { S.page--; S.pageDir = -1; S.hi = 0; render('page'); } return; }
}

let shiftAlone = false;
stage.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Shift') { shiftAlone = true; return; }
  shiftAlone = false; stopPlay();
  const k = e.key.length === 1 && !S.ascii ? e.key.toLowerCase() : e.key;
  if (k.length === 1 || ['Backspace', 'Escape', 'Enter', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(k)) { e.preventDefault(); key(k); }
});
stage.addEventListener('keyup', e => { if (e.key === 'Shift' && shiftAlone) { shiftAlone = false; key('Shift'); } });
stage.addEventListener('mousedown', () => stage.focus());

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const n = Math.ceil(dt / (1 / 240)), h = dt / n;
  for (let i = 0; i < n; i++) { [W, H, Y, A, L, R].forEach(s => s.step(h)); flies.forEach(f => { f.x.step(h); f.y.step(h); f.k.step(h); }); }
  if (S.visible) {
    const w = Math.max(0, W.v), hh = Math.max(0, H.v);
    bar.style.width = w + 'px'; bar.style.height = hh + 'px'; bar.style.left = anchor.x + 'px'; bar.style.top = Y.v + 'px';
    bar.style.borderRadius = Math.min(hh / 2, 16) + 'px';
    const reveal = fx.drop ? Math.min(1, Math.max(0, (w - 30) / Math.max(1, W.t - 30))) * A.v : 1;
    cellsEl.style.opacity = pager.style.opacity = hl.style.opacity = reveal;
    const stretch = Math.max(0, (R.v - L.v) - (R.t - L.t));
    hl.style.transform = `translateX(${L.v}px) scaleY(${1 - Math.min(stretch, 90) / 420})`;
    hl.style.width = Math.max(0, R.v - L.v) + 'px'; hl.style.height = (hh - 10) + 'px';
    if (S.closing && W.v < 16 && Math.abs(W.vel) < 40) { S.visible = false; S.closing = false; bar.style.display = 'none'; }
  }
  flies = flies.filter(f => {
    f.el.style.transform = `translate(${f.x.v}px, ${f.y.v}px) scale(${f.k.v})`;
    const age = now - f.born;
    if ((f.x.settled() && f.y.settled() && f.k.settled()) || age > 900) { f.land.classList.remove('landing'); f.el.remove(); return false; }
    return true;
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

document.querySelectorAll('[data-fx]').forEach(b => b.onclick = () => { fx[b.dataset.fx] = fx[b.dataset.fx] ? 0 : 1; b.classList.toggle('on', !!fx[b.dataset.fx]); applyBodyClasses(); syncCompare(); stage.focus(); });
function syncCompare() { const none = Object.values(fx).every(v => !v); $('compare').classList.toggle('on', none); }
$('compare').onclick = () => { const none = Object.values(fx).every(v => !v); Object.keys(fx).forEach(k => fx[k] = none ? 1 : 0);
  document.querySelectorAll('[data-fx]').forEach(b => b.classList.toggle('on', !!fx[b.dataset.fx])); applyBodyClasses(); syncCompare(); stage.focus(); };

let playTimer = null;
const SCRIPT = [['t', 'nihao'], ['w', 500], ['k', ' '], ['w', 350], ['t', 'shijie'], ['w', 400], ['k', 'ArrowRight'], ['w', 300], ['k', 'ArrowRight'], ['w', 300], ['k', 'ArrowLeft'], ['w', 260], ['k', 'ArrowLeft'], ['w', 420], ['k', ' '], ['w', 400], ['k', ','], ['w', 200],
  ['t', 'jintiantianqizhenhao'], ['w', 900], ['k', ' '], ['w', 300], ['k', '.'], ['w', 400], ['k', 'Shift'], ['w', 500], ['t', ' Hi'], ['w', 300], ['k', 'Shift'], ['w', 600],
  ['t', 'woxiangzuoyigeshurufa'], ['w', 800], ['k', '='], ['w', 700], ['k', '-'], ['w', 600], ['k', ' '], ['w', 400], ['k', ','], ['t', 'yaogaojijingyan'], ['w', 300], ['k', 'Escape'], ['t', 'yetaiboli'], ['w', 800], ['k', ' ']];
function stopPlay() { clearTimeout(playTimer); playTimer = null; $('play').textContent = '▶ 自动演示'; }
function play() {
  stopPlay(); $('committed').innerHTML = ''; S.input = ''; S.ascii = false; update('type'); $('play').textContent = '■ 停止'; stage.focus();
  const steps = []; SCRIPT.forEach(([t, v]) => { if (t === 't') [...v].forEach(ch => steps.push(['k', ch, 85 + Math.random() * 60])); else if (t === 'k') steps.push(['k', v, 120]); else steps.push(['w', v]); });
  let i = 0; const next = () => { if (i >= steps.length) return stopPlay(); const [t, v, d] = steps[i++];
    if (t === 'k') { key(S.ascii ? v : (v.length === 1 ? v.toLowerCase() : v)); playTimer = setTimeout(next, d); } else playTimer = setTimeout(next, v); };
  playTimer = setTimeout(next, 300);
}
$('play').onclick = () => playTimer ? stopPlay() : play();
applyBodyClasses();
setTimeout(play, 600);
</script>
